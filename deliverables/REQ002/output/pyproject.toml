[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nas-mcp-server"
version = "0.1.0"
description = "MCP Server for NAS file operations via SSE transport"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
nas-mcp-server = "nas_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nas_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
